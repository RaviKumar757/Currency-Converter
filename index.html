<!DOCTYPE html>
<html>
<head>
  <title>Counter App</title>
</head>
<body>

  <h1>Counter App</h1>

  <h2 id="count">0</h2>

  <button onclick="decrement()">- Decrement</button>
  <button onclick="increment()">+ Increment</button>
  <button onclick="reset()">Reset</button>

  <script>
    let count = 0;

    function updateUI() {
      document.getElementById("count").innerText = count;
    }

    function increment() {
      count++;
      updateUI();
    }

    function decrement() {
      count--;
      updateUI();
    }

    function reset() {
      count = 0;
      updateUI();
    }
  </script>

</body>
</html>
